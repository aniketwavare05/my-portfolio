<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="380" rx="12" fill="#0b1329" />
  
  <!-- Browser Chrome / Header -->
  <rect width="600" height="42" rx="12" fill="#152144" />
  <rect y="30" width="600" height="12" fill="#152144" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="90" y="26" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SkyPulse Weather &amp; Climate</text>
  
  <!-- Left Side: Weather Status -->
  <rect x="25" y="65" width="220" height="295" rx="10" fill="url(#p3Grad)" />
  <text x="45" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">San Francisco, CA</text>
  <text x="45" y="120" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12">Partly Cloudy • Wind 12 mph</text>
  
  <!-- Sun / Cloud Icon -->
  <circle cx="160" cy="180" r="30" fill="#fde047" opacity="0.9" />
  <circle cx="130" cy="195" r="24" fill="#ffffff" opacity="0.9" />
  <circle cx="165" cy="195" r="28" fill="#ffffff" opacity="0.9" />
  <circle cx="195" cy="198" r="20" fill="#ffffff" opacity="0.9" />
  <rect x="130" y="196" width="65" height="22" fill="#ffffff" opacity="0.9" />

  <text x="45" y="265" fill="#ffffff" font-family="system-ui, sans-serif" font-size="46" font-weight="bold">72°F</text>
  <text x="45" y="295" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="13">High: 76° • Low: 58°</text>
  <text x="45" y="325" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11">Humidity: 48% • AQI: 32 (Good)</text>

  <!-- Right Side: 7-Day Forecast & Hourly Chart -->
  <rect x="265" y="65" width="310" height="150" rx="8" fill="#152144" />
  <text x="285" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TEMPERATURE TREND (24H)</text>
  <!-- Chart area -->
  <path d="M 285 185 Q 330 140, 360 160 T 430 130 T 500 145 T 550 115 L 550 195 L 285 195 Z" fill="url(#lineGrad)" />
  <path d="M 285 185 Q 330 140, 360 160 T 430 130 T 500 145 T 550 115" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <circle cx="430" cy="130" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
  <text x="430" y="118" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">75°</text>

  <!-- Mini Forecast Grid -->
  <rect x="265" y="230" width="310" height="130" rx="8" fill="#152144" />
  <text x="285" y="255" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">5-DAY FORECAST</text>
  
  <!-- Day 1 -->
  <text x="290" y="285" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Mon</text>
  <circle cx="350" cy="281" r="7" fill="#fde047" />
  <text x="540" y="285" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">74° / 58°</text>
  <rect x="380" y="278" width="130" height="6" rx="3" fill="#334155" />
  <rect x="400" y="278" width="70" height="6" rx="3" fill="#06b6d4" />

  <!-- Day 2 -->
  <text x="290" y="315" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Tue</text>
  <circle cx="350" cy="311" r="7" fill="#60a5fa" />
  <text x="540" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">68° / 54°</text>
  <rect x="380" y="308" width="130" height="6" rx="3" fill="#334155" />
  <rect x="390" y="308" width="60" height="6" rx="3" fill="#3b82f6" />

  <!-- Day 3 -->
  <text x="290" y="345" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Wed</text>
  <circle cx="350" cy="341" r="7" fill="#fde047" />
  <text x="540" y="345" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">77° / 60°</text>
  <rect x="380" y="338" width="130" height="6" rx="3" fill="#334155" />
  <rect x="410" y="338" width="80" height="6" rx="3" fill="#f59e0b" />
</svg>
