<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfba" />
      <stop offset="100%" stop-color="#f1c27d" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with vibrant gradient -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.3" />

  <!-- Avatar Group -->
  <g filter="url(#softShadow)">
    <!-- Shoulders / Torso -->
    <path d="M110 350 C110 280, 140 250, 200 250 C260 250, 290 280, 290 350 Z" fill="url(#shirtGrad)" />
    <!-- Collar / Shirt Neckline -->
    <path d="M175 250 L200 280 L225 250 Z" fill="#e2e8f0" />

    <!-- Neck -->
    <rect x="182" y="215" width="36" height="45" rx="10" fill="url(#skinGrad)" />

    <!-- Head / Face -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)" />

    <!-- Hair (Back/Top) -->
    <path d="M142 165 C140 115, 170 105, 200 105 C235 105, 260 118, 258 165 C250 140, 240 130, 200 130 C160 130, 150 145, 142 165 Z" fill="url(#hairGrad)" />

    <!-- Eyes -->
    <circle cx="180" cy="175" r="5" fill="#1e293b" />
    <circle cx="220" cy="175" r="5" fill="#1e293b" />
    <circle cx="182" cy="173" r="1.5" fill="#ffffff" />
    <circle cx="222" cy="173" r="1.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M170 162 Q180 157 190 162" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M210 162 Q220 157 230 162" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Glasses -->
    <rect x="165" y="163" width="28" height="22" rx="6" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <rect x="207" y="163" width="28" height="22" rx="6" fill="none" stroke="#0f172a" stroke-width="3.5" />
    <line x1="193" y1="174" x2="207" y2="174" stroke="#0f172a" stroke-width="3.5" />

    <!-- Smile -->
    <path d="M188 206 Q200 218 212 206" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cheeks (Blush) -->
    <circle cx="168" cy="192" r="7" fill="#f43f5e" opacity="0.25" />
    <circle cx="232" cy="192" r="7" fill="#f43f5e" opacity="0.25" />
  </g>

  <!-- Coding badge in corner -->
  <g transform="translate(280, 270)">
    <circle cx="25" cy="25" r="25" fill="#0f172a" />
    <text x="25" y="32" font-family="monospace" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
